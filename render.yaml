services:
  # PostgreSQL Database
  - type: pserv
    name: disneyplus-db
    env: docker
    plan: free
    healthCheckPath: /healthz
    region: oregon
    dockerfilePath: ./Dockerfile
    repo: https://github.com/your-username/disneyplus-clone
    branch: main
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: disneyplus-db
          property: connectionString

  # Next.js Application
  - type: web
    name: disneyplus-clone
    env: docker
    plan: free
    healthCheckPath: /api/health
    region: oregon
    dockerfilePath: ./Dockerfile
    repo: https://github.com/your-username/disneyplus-clone
    branch: main
    autoDeploy: true
    buildCommand: npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: disneyplus-db
          property: connectionString

      # NextAuth
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://disneyplus-clone.onrender.com

      # API Keys (You'll need to add these manually in Render dashboard)
      - key: TMDB_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # OAuth (Add these manually in Render dashboard)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: disneyplus-db
    plan: free
    region: oregon